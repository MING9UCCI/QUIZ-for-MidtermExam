<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101821"><meta name="description" content="데이터베이스, 인공지능, 소프트웨어공학. 강의자료로 만든 120문제 픽셀 학습 퀘스트.">
<title>시험 전날 · MIDTERM QUEST</title>
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
<header class="header"><a class="brand" href="#home" aria-label="시험 전날 홈"><span class="brand-icon">✦</span><span>시험 전날<small>MIDTERM QUEST</small></span></a><div class="header-tools"><span id="level" class="level">LV. 01</span><button id="settings-open" class="icon-btn" aria-label="설정">⚙</button></div></header>
<main id="main" tabindex="-1"><p class="loading">모험을 준비하고 있습니다…</p></main>
<footer>한 문제씩, 레벨 업. <span>저장 기록은 이 기기에만 남아요.</span></footer>
</div>
<dialog id="settings"><form method="dialog"><div class="dialog-head"><h2>게임 설정</h2><button class="icon-btn" aria-label="설정 닫기">×</button></div><label class="setting"><span>문제 타이머<small>객관식 30초 · OX 20초 · 단답 45초</small></span><input type="checkbox" id="timer-setting"></label><label class="setting"><span>효과음<small>정답과 콤보를 소리로 알려드려요</small></span><input type="checkbox" id="sound-setting"></label><p class="muted">단답형은 예시 답안과 비교해 직접 채점합니다.<br>출처는 PDF 파일의 첫 장부터 센 페이지입니다.</p><button type="button" id="export" class="secondary full">학습 기록 내보내기</button><button type="button" id="reset" class="danger-link full">학습 기록 초기화</button><p id="storage-warning" role="status"></p></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title">확인</h2><p id="confirm-message"></p><div class="actions"><button id="confirm-no" class="secondary">취소</button><button id="confirm-yes" class="primary">확인</button></div></dialog>
<div id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body></html>
